    arousalDown: ["slow", "slowly", "quiet", "quietly", "slept", "sleep", "asleep", "still", "rest", "soft", "calm", "sat", "sitting", "nothing", "gentle", "nap", "bath", "tea", "read", "reading", "breathe", "breathing", "lay", "window", "sun"],
    tension: ["should", "should have", "what if", "worry", "worried", "worrying", "anxious", "anxiety", "clench", "clenching", "clenched", "tight", "deadline", "behind", "afraid", "nervous", "overthinking", "overthink", "replaying", "can't stop", "jaw", "stuck", "pressure", "mistake", "panic", "if only", "too much", "late", "unsure", "uncertain"],
    warmth: ["mom", "mum", "dad", "sister", "brother", "friend", "friends", "called", "call", "hug", "hugged", "together", "laughed", "dinner", "table", "we", "us", "home", "kind", "love", "loved", "bread", "cooked", "baked", "shared", "held", "close", "family", "cat", "dog", "stayed", "visit", "visited", "talked", "listened"]
  };
  const THEMES = {
    work:        ["work", "project", "deadline", "meeting", "email", "boss", "draft", "office", "shift", "client", "task", "tasks"],
    connection:  ["mom", "mum", "dad", "friend", "friends", "called", "we", "together", "dinner", "talked", "family", "sister", "brother", "partner", "date"],
    rest:        ["slept", "sleep", "nap", "rest", "rested", "quiet", "slow", "bath", "read", "couch", "window", "sun"],
    "self care": ["walk", "walked", "breathe", "breathing", "market", "cooked", "journal", "stretch", "shower", "water", "peach", "ate", "eat"],
    change:      ["finally", "first", "new", "start", "started", "moving", "decided", "change", "different", "begin", "again"],
    overthinking:["what if", "replaying", "should", "overthinking", "can't stop", "spinning", "wonder", "worry", "worried", "thinking"],
    gratitude:   ["grateful", "thankful", "lucky", "enough", "allowed", "glad", "appreciate"],
    body:        ["tired", "jaw", "headache", "sick", "hurt", "hurts", "exhausted", "ache", "sore", "hungry"]
  };
  const DESCRIPTORS = {
    // [valence, arousal] quadrant × tension
    brightCalm:  ["a low warm hum, like bread still cooling", "a slow bright morning, nothing hurried", "soft light through a half-open window"],
    brightAlive: ["a bright quick thing, all sparks", "a kitchen full of talk and steam", "a run downhill with the wind behind"],
    darkCalm:    ["a grey lake, very still", "a quiet room after everyone left", "a long exhale that hasn't ended yet"],
    darkAlive:   ["a tight wire, humming", "a restless hope, thin at the edges", "rain on a tin roof, all night"],
    neutral:     ["a held breath, undecided", "a page half-written", "a middle kind of day"]
  };
  const QUOTES = {
    brightCalm:  ["Nothing happened, and it was everything.", "Some days are allowed to be soft.", "Enough was, for once, enough."],
    brightAlive: ["Some days sound brighter than others.", "Loud, and glad of it.", "Every spark was mine."],
    darkCalm:    ["Even the quiet is a kind of music.", "Low notes still count as notes.", "The lake doesn't hurry either."],
    darkAlive:   ["Even a tight string is tuned to something.", "A softer me still makes a sound.", "Restless is another word for reaching."],
    neutral:     ["Same sky, different song.", "Small steps still count.", "Not every day resolves. That's fine."]
  };
  const TAG_WORDS = {
    positive: ["hopeful", "glad", "light"], negative: ["heavy", "low", "tender"],
    arousalUp: ["wired", "restless", "alive"], arousalDown: ["slow", "quiet", "still"],
    tension: ["tense", "uncertain", "nervous"], warmth: ["warm", "held", "close"]
  };

  function score(tokens, text, list) {
    let hits = 0; const found = [];
    for (const term of list) {
      if (term.includes(" ")) { const re = new RegExp("\\b" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/'/g, "['’]") + "\\b", "gi"); const m = text.match(re); if (m) { hits += m.length * 1.5; found.push(term); } }
      else { const n = tokens.filter(t => t === term).length; if (n) { hits += n; found.push(term); } }
    }
    return { hits, found };
  }
  const pick = (arr, seed) => arr[Math.abs(seed) % arr.length];
  const hashStr = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

  /**
   * analyzeLocal(text, base?) → partial affect (everything but date/time/title
   * unless base lacks them). Deterministic. Good enough to keep a demo alive.
   */
  function analyzeLocal(text, base = {}) {
    const raw = String(text || "");
    const lower = raw.toLowerCase().replace(/[’‘]/g, "'");
    const tokens = lower.split(/\s+/).map(normalize).filter(Boolean);
    const n = Math.max(6, tokens.length), k = Math.sqrt(n) * 0.7;    // normaliser: short entries swing more
    const s = {};
    for (const key of Object.keys(LEX)) s[key] = score(tokens, lower, LEX[key]);
    const excl = (raw.match(/!/g) || []).length, q = (raw.match(/\?/g) || []).length;

    const valence = clamp(Math.tanh((s.positive.hits - s.negative.hits) / k), -1, 1);
    const arousal = clamp(0.45 + Math.tanh((s.arousalUp.hits + excl * 0.6 - s.arousalDown.hits) / k) * 0.5, 0, 1);
    const tension = clamp(0.35 + Math.tanh((s.tension.hits + q * 0.5 - s.arousalDown.hits * 0.4) / k) * 0.6, 0, 1);
    const warmth  = clamp(0.35 + Math.tanh((s.warmth.hits + s.positive.hits * 0.3 - s.negative.hits * 0.2) / k) * 0.6, 0, 1);

    const quadrant = Math.abs(valence) < 0.12 ? "neutral" : valence > 0 ? (arousal > 0.5 ? "brightAlive" : "brightCalm") : (arousal > 0.5 ? "darkAlive" : "darkCalm");
    const seed = hashStr(lower.slice(0, 80));

    // tags: the categories that clearly scored, strongest first, never contradicting the valence
    const ranked = Object.keys(s).sort((a, b) => s[b].hits - s[a].hits).filter((key, i) => s[key].hits > 0 && (i === 0 || s[key].hits >= 2));
    const tags = [];
    for (const key of ranked) {
      if ((key === "positive" && valence < -0.15) || (key === "negative" && valence > 0.15)) continue;
      if (key === "warmth" && warmth < 0.5) continue;
      const w = pick(TAG_WORDS[key], seed + tags.length); if (!tags.includes(w)) tags.push(w); if (tags.length >= 4) break;
    }
    if (!tags.length) tags.push("quiet", "unsure");
    if (tension > 0.65 && !tags.includes("tense")) tags.unshift("tense");
    if (warmth > 0.65 && !tags.includes("warm")) tags.unshift("warm");
    const mood_tags = [...new Set(tags)].slice(0, 5);

    // emotional words: phrases first, then single hits, in text order (warmth nouns like "mom" aren't feelings)
    const warmOk = s.warmth.found.filter(w => ["laughed", "hug", "hugged", "held", "together", "love", "loved", "kind", "close", "stayed"].includes(w));
    const phrases = [...new Set([...s.tension.found, ...s.arousalUp.found, ...s.negative.found, ...s.positive.found, ...warmOk])];
    const emotional_words = phrases
      .map(p => ({ p, i: lower.indexOf(p) })).filter(x => x.i >= 0)
      .sort((a, b) => (b.p.includes(" ") - a.p.includes(" ")) || a.i - b.i)
      .slice(0, 3).sort((a, b) => a.i - b.i).map(x => x.p);

    const themes = Object.keys(THEMES).map(t => ({ t, h: score(tokens, lower, THEMES[t]).hits })).filter(x => x.h > 0).sort((a, b) => b.h - a.h).slice(0, 3).map(x => x.t);

    // PRD §5.12: heavy/wired → chamomile · flat/low-energy → cappuccino · low mood → hot chocolate
    const family = (tension > 0.6 && arousal > 0.5) ? "herbal" : (valence < -0.25 && arousal < 0.5) ? "chocolate" : (arousal < 0.5 && Math.abs(valence) < 0.25) ? "coffee" : (warmth > 0.6 ? "coffee" : "herbal");
    const drink = {
      herbal:    { family, name: tension > 0.75 ? "Peppermint" : "Chamomile", reason: "a heavy, wired day — something to slow down." },
      coffee:    { family, name: arousal < 0.4 ? "Cappuccino" : "Flat white", reason: "a slow, level day — something to sit with, not to fix." },
      chocolate: { family, name: "Hot chocolate", reason: "a low day — something sweet and unhurried." }
    }[family];

    const adj = mood_tags[0] || "quiet", noun = { brightCalm: "fullness", brightAlive: "spark", darkCalm: "hush", darkAlive: "anticipation", neutral: "middle" }[quadrant];
    return {
      valence: +valence.toFixed(2), arousal: +arousal.toFixed(2), tension: +tension.toFixed(2), warmth: +warmth.toFixed(2),
      mood_name: `${adj} ${noun}`,
      mood_tags, emotional_words, themes,
      descriptor: pick(DESCRIPTORS[quadrant], seed),
      song_quote: pick(QUOTES[quadrant], seed >> 3),
      drink,
      title: base.title && base.title !== "untitled" && base._analysis !== "local" ? base.title : `a ${adj} day`,   // keep a hand-given title; let an auto title follow the words
      _analysis: "local"
    };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     2. Word markup (same shape as composure.html's markupBody)
     ═══════════════════════════════════════════════════════════════════════ */
  function markup(text, phrases) {
    const paras = String(text || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const targets = (phrases || []).map(p => p.split(/\s+/).map(normalize).filter(Boolean)).filter(t => t.length);
    let wordIndex = 0, hlIndex = 0, html = "";
    for (const para of paras) {
      const toks = para.split(/\s+/), norm = toks.map(normalize);
      const starts = new Map(), taken = new Array(toks.length).fill(false);
      for (const t of targets) for (let i = 0; i + t.length <= toks.length; i++) {
        let ok = true;
        for (let j = 0; j < t.length; j++) if (norm[i + j] !== t[j] || taken[i + j]) { ok = false; break; }
        if (!ok) continue;
        starts.set(i, i + t.length - 1);
        for (let j = i; j <= i + t.length - 1; j++) taken[j] = true;
        i += t.length - 1;
      }
      html += "<p>"; let closeAt = -1;
      toks.forEach((tok, i) => {
        if (starts.has(i)) { html += `<span class="hl" style="--h:${hlIndex++}">`; closeAt = starts.get(i); }
        html += `<span class="w" style="--i:${wordIndex++}" data-w="${wordIndex - 1}">${esc(tok)}</span>`;
        const last = i === toks.length - 1;
        if (i === closeAt) { html += "</span>" + (last ? "" : " "); closeAt = -1; } else if (!last) html += " ";
      });
      html += "</p>";
    }
    return { html, words: wordIndex, highlights: hlIndex };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     3. The controller
     ═══════════════════════════════════════════════════════════════════════ */
  const state = {
    host: null, date: null, tool: "pen", mode: "view",        // mode: view | write | highlight
    text: "", manual: {}, dirty: false, listening: false, timer: 0, rec: null, drag: null
  };
  const store = {
    key: "composure.manual-highlights",
    load() { try { state.manual = JSON.parse(localStorage.getItem(this.key) || "{}"); } catch { state.manual = {}; } },
    save() { try { localStorage.setItem(this.key, JSON.stringify(state.manual)); } catch { /* private mode */ } }
  };

  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const nowTime = () => new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const phrasesFor = (entry) => [...new Set([...(state.manual[entry.date] || []), ...(entry.emotional_words || [])])];

  function mount(host) {
    state.host = Object.assign({ analyze: analyzeLocal, markup, debounceMs: 900, tools: {} }, host);
    store.load();
    const { body, tools } = state.host;
    body.addEventListener("input", onInput);
    body.addEventListener("keydown", (e) => { if (e.key === "Escape") { body.blur(); } });
    body.addEventListener("blur", () => {                  // pen lifted: save if needed, then read
      if (state.mode !== "write") return;
      if (state.dirty || !state.host.getEntry(state.date)) commit();
      else if (state.text.trim()) enterView(true);
    });
    body.addEventListener("pointerdown", onPointerDown);
    body.addEventListener("click", () => {                 // click the page to start writing on it
      if (state.locked || state.mode !== "view" || state.tool !== "pen") return;
      enterWrite(true);
    });
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.tool === "highlighter") setTool("pen"); });
    if (tools.pen) tools.pen.addEventListener("click", () => { setTool("pen"); focusEnd(); });
    if (tools.highlighter) tools.highlighter.addEventListener("click", () => setTool(state.tool === "highlighter" ? "pen" : "highlighter"));
    if (tools.mic) { tools.mic.addEventListener("click", toggleSpeech); if (!SpeechCtor()) tools.mic.classList.add("unsupported"); }
    setTool("pen");
    return api;
  }

  /** Open a day for reading/writing. Empty days start blank with a prompt. */
  function open(date) {
    if (state.mode === "write" && state.dirty) commit();
    stopSpeech();
    state.date = date;
    const entry = state.host.getEntry(date);
    state.text = entry ? entry.text : "";
    state.dirty = false;
    if (entry) { state.host.onRender(entry); }
    else {
      const blank = { date, time: "", title: "", text: "", mood_tags: [], emotional_words: [], themes: [], descriptor: "", song_quote: "", mood_name: "", _blank: true };
      state.host.onRender(blank);
    }
    if (state.tool === "highlighter") renderSpans("highlight");
    else if (entry) enterView(false);          // read first; click the page (or the pen) to write
    else enterWrite(true);
    return entry;
  }

  /* ── write mode ─────────────────────────────────────────────────────── */
  function enterWrite(focus) {
    const { body } = state.host;
    state.mode = "write";
    body.classList.add("writing"); body.classList.remove("highlighting");
    body.contentEditable = "true"; body.spellcheck = false;
    body.setAttribute("role", "textbox"); body.setAttribute("aria-multiline", "true");
    body.dataset.placeholder = state.host.placeholder || "what did today feel like?";
    body.textContent = state.text;
    if (focus) focusEnd();
  }
  /** Read mode: the page as inked spans. repaint=false keeps whatever onRender just drew (its animation). */
  function enterView(repaint) {
    const { body } = state.host;
    if (repaint) renderSpans("view");
    state.mode = "view";
    body.contentEditable = "false"; body.classList.remove("writing", "highlighting");
    body.removeAttribute("role"); body.removeAttribute("aria-multiline");
  }
  function focusEnd() {
    const { body } = state.host;
    if (state.mode !== "write") enterWrite(false);
    body.focus();
    const sel = window.getSelection(), r = document.createRange();
    r.selectNodeContents(body); r.collapse(false); sel.removeAllRanges(); sel.addRange(r);
  }
  function readText() {
    // innerText keeps the user's line breaks; collapse 3+ newlines to a paragraph break
    return state.host.body.innerText.replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").replace(/[ \t]+\n/g, "\n").trim();
  }
  function onInput() {
    if (state.mode !== "write") return;
    state.text = readText(); state.dirty = true;
    clearTimeout(state.timer);
    state.timer = setTimeout(() => analyzeAndSave(false), state.host.debounceMs);
  }
  /** Save the current text as the day's entry (analysis included). */
  function commit() { clearTimeout(state.timer); if (state.dirty || !state.host.getEntry(state.date)) return analyzeAndSave(true); }

  let analyzing = null;
  async function analyzeAndSave(final) {
    const text = state.text, date = state.date;
    if (!text.trim()) return null;
    const prev = state.host.getEntry(date) || {};
    const token = analyzing = {};
    let partial;
    try { partial = await state.host.analyze(text, prev); }
    catch { partial = analyzeLocal(text, prev); }
    if (analyzing !== token || state.date !== date) return null;   // superseded by newer typing / another day
    const entry = Object.assign({}, prev, partial, { date, text, time: prev.time || nowTime() });
    entry.emotional_words = phrasesFor(entry).slice(0, 6);
    const saved = state.host.saveEntry(entry);
    state.dirty = false;
    if (state.mode === "write") state.host.onRender(saved, { keepBody: true });   // the page is being typed on; don't re-ink it
    else renderSpans(state.mode === "highlight" ? "highlight" : "view");
    if (final && state.mode === "write" && document.activeElement !== state.host.body) enterView(true);   // pen lifted → read mode
    if (final && state.host.onCommit) state.host.onCommit(saved);
    return saved;
  }

  /* ── speech ─────────────────────────────────────────────────────────── */
  const SpeechCtor = () => window.SpeechRecognition || window.webkitSpeechRecognition || null;
  function toggleSpeech() { state.listening ? stopSpeech() : startSpeech(); }
  function startSpeech() {
    const Ctor = SpeechCtor();
    if (!Ctor) { note("speech isn't available in this browser — typing works"); return; }
    if (state.mode !== "write") enterWrite(true); else focusEnd();
    const rec = new Ctor();
    rec.lang = state.host.lang || navigator.language || "en-US";
    rec.continuous = true; rec.interimResults = true;
    const base = state.text;            // what was on the page before dictation
    let finalText = "";
    rec.onresult = (ev) => {
      let interim = "";
      finalText = "";
      for (let i = 0; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript; }
      const joined = (base ? base.replace(/\s+$/, "") + " " : "") + finalText.trim();
      state.host.body.textContent = joined + (interim ? " " : "");
      if (interim) { const s = document.createElement("span"); s.className = "interim"; s.textContent = interim; state.host.body.appendChild(s); }
      state.text = joined.trim(); state.dirty = true;
      clearTimeout(state.timer); state.timer = setTimeout(() => analyzeAndSave(false), state.host.debounceMs);
    };
    rec.onerror = (e) => { note(e.error === "not-allowed" ? "microphone blocked — typing works" : "mic hiccup: " + e.error); stopSpeech(); };
    rec.onend = () => { if (state.listening) { try { rec.start(); } catch { stopSpeech(); } } };   // Chrome stops after silence; keep going
    try { rec.start(); } catch (e) { note("couldn't start the mic"); return; }
    state.rec = rec; state.listening = true;
    if (state.host.tools.mic) { state.host.tools.mic.classList.add("listening"); state.host.tools.mic.setAttribute("aria-pressed", "true"); }
    note("listening…");
  }
  function stopSpeech() {
    if (!state.listening) return;
    state.listening = false;
    try { state.rec && state.rec.stop(); } catch { /* ok */ }
    state.rec = null;
    const interim = state.host.body.querySelector(".interim"); if (interim) interim.remove();
    if (state.host.tools.mic) { state.host.tools.mic.classList.remove("listening"); state.host.tools.mic.setAttribute("aria-pressed", "false"); }
    note("");
    state.text = readText(); if (state.text) { state.dirty = true; commit(); }
  }

  /* ── highlighter ────────────────────────────────────────────────────── */
  function setTool(tool) {
    const { body, tools } = state.host;
    if (tool === "highlighter") { if (state.mode === "write") commit(); stopSpeech(); }
    state.tool = tool;
    document.documentElement.dataset.tool = tool;
    for (const [name, el] of Object.entries(tools)) if (el && name !== "mic") el.classList.toggle("tool-active", name === tool);
    if (tool === "highlighter") { body.classList.add("highlighting"); renderSpans(); note("drag across the words that carry the feeling · click a mark to remove it · esc for pen"); }
    else { body.classList.remove("highlighting"); if (state.date) { if (state.host.getEntry(state.date)) enterView(true); else enterWrite(false); } note(""); }
    if (state.host.onTool) state.host.onTool(tool);
  }
  /** Re-render the page as word spans (view/highlight mode). */
  function renderSpans(mode = "highlight") {
    const { body } = state.host;
    const entry = state.host.getEntry(state.date);
    state.mode = mode;
    body.contentEditable = "false"; body.classList.remove("writing"); body.classList.add("no-anim");
    body.classList.toggle("highlighting", mode === "highlight");
    body.removeAttribute("role"); body.removeAttribute("aria-multiline");
    body.innerHTML = state.host.markup(entry ? entry.text : state.text, entry ? phrasesFor(entry) : state.manual[state.date] || []).html;
    // mark which highlights are the writer's own
    const mine = new Set((state.manual[state.date] || []).map(p => p.toLowerCase().replace(/[’‘]/g, "'")));
    body.querySelectorAll(".hl").forEach(h => { if (mine.has(h.textContent.trim().toLowerCase().replace(/[’‘]/g, "'"))) h.classList.add("manual"); });
  }
  const wordAt = (x, y) => { const el = document.elementFromPoint(x, y); const w = el && el.closest && el.closest(".w"); return w && state.host.body.contains(w) ? w : null; };
  function onPointerDown(e) {
    if (state.tool !== "highlighter" || state.mode !== "highlight") return;
    const w = wordAt(e.clientX, e.clientY); if (!w) return;
    e.preventDefault();
    const hl = w.closest(".hl");
    if (hl && hl.classList.contains("manual")) { removeManual(hl.textContent.trim()); return; }   // click a mark → remove it
    state.drag = { start: +w.dataset.w, end: +w.dataset.w };
    paintPreview();
  }
  function onPointerMove(e) {
    if (!state.drag) return;
    const w = wordAt(e.clientX, e.clientY); if (!w) return;
    state.drag.end = +w.dataset.w; paintPreview();
  }
  function onPointerUp() {
    if (!state.drag) return;
    const { start, end } = state.drag; state.drag = null;
    const [a, b] = [Math.min(start, end), Math.max(start, end)];
    const words = [...state.host.body.querySelectorAll(".w")].filter(w => +w.dataset.w >= a && +w.dataset.w <= b);
    const phrase = words.map(w => w.textContent).join(" ").trim();
    state.host.body.querySelectorAll(".w.preview").forEach(w => w.classList.remove("preview"));
    if (!phrase) return;
    addManual(phrase);
  }
  function paintPreview() {
    const { start, end } = state.drag, [a, b] = [Math.min(start, end), Math.max(start, end)];
    state.host.body.querySelectorAll(".w").forEach(w => w.classList.toggle("preview", +w.dataset.w >= a && +w.dataset.w <= b));
  }
  function addManual(phrase) {
    const list = state.manual[state.date] || [];
    const norm = phrase.toLowerCase();
    // absorb any existing marks the new one overlaps
    const kept = list.filter(p => !norm.includes(p.toLowerCase()) && !p.toLowerCase().includes(norm));
    kept.push(phrase);
    state.manual[state.date] = kept; store.save();
    syncHighlights();
  }
  function removeManual(phrase) {
    const norm = phrase.toLowerCase().replace(/[’‘]/g, "'");
    state.manual[state.date] = (state.manual[state.date] || []).filter(p => p.toLowerCase().replace(/[’‘]/g, "'") !== norm);
    store.save();
    syncHighlights();
  }
  /** Manual marks feed the entry's emotional_words, then the page re-inks. */
  function syncHighlights() {
    const entry = state.host.getEntry(state.date);
    if (entry) {
      const auto = (entry._auto_words || entry.emotional_words || []);
      const merged = Object.assign({}, entry, { _auto_words: auto, emotional_words: [...new Set([...(state.manual[state.date] || []), ...auto])].slice(0, 6) });
      const saved = state.host.saveEntry(merged);
      state.host.onRender(saved, { keepBody: true });
    }
    renderSpans();
    if (state.host.onHighlight) state.host.onHighlight(state.manual[state.date] || []);
  }

  function note(msg) { if (state.host.status) state.host.status.textContent = msg; }

  const api = { mount, open, setTool, commit, startSpeech, stopSpeech, toggleSpeech, analyzeLocal, markup, state, today,
                view: () => enterView(true), lock: (on) => { state.locked = !!on; },
                get manual() { return state.manual; } };
  return api;
});
</script>

<script id="tone-engine">
/* ═══════════════════════════════════════════════════════════════════════════
   tone-engine.js — Composure's affect → music engine (PRD §6)

   Deterministic, client-side, no LLM. Requires Tone.js (v14.x) as the global
   `Tone` for playback; the planning half (motifFor / weekPlan) is pure and
   works without Tone loaded, so visuals can draw the notes before audio starts.

   Mapping
     valence  → mode (phrygian … ionian) + timbre (sine … saw) + register
     arousal  → tempo (60–135 bpm), note density, dynamics, a pulse above .55
     tension  → step-wise motion, chromatic alterations, staccato, sharp attack,
                a b2 rubbed into the pad, an unresolved ending
     warmth   → reverb size/wet, softer attack, gentler low-pass, pad level
     themes   → the melodic shape (rhythm + contour) is seeded from the first
                theme, so days sharing a theme share a motif — a leitmotif.

   Usage (inline into composure.html as a <script>, or <script src>):
     const plan   = ToneEngine.motifFor(affect);          // pure: notes, bpm, mode…
     ToneEngine.prepare(affect, { plan });                 // optional: warm up during visuals
     const handle = await ToneEngine.playMotif(affect, { plan, onNote, onEnd });
     const week   = await ToneEngine.composeWeek(entries, { onDay, onNote, onEnd });
     ToneEngine.pause(); ToneEngine.resume(); ToneEngine.stop();
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  root.ToneEngine = api;
})(typeof window !== "undefined" ? window : globalThis, function () {
  "use strict";

  /* ── small utilities ─────────────────────────────────────────────────── */
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function hash(str) {                       // FNV-1a, 32-bit
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed) {                // tiny seeded PRNG
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const NAMES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const NAMES_FLAT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
  const FLAT_ROOTS  = new Set([5, 10, 3, 8, 1]); // F, Bb, Eb, Ab, Db spell with flats
  function noteName(midi, rootPc = 0) {
    const names = FLAT_ROOTS.has(rootPc % 12) ? NAMES_FLAT : NAMES_SHARP;
    return names[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
  }

  /* ── affect normalisation ────────────────────────────────────────────── */
  function normalizeAffect(a) {
    a = a || {};
    const n = (k, d, lo, hi) => { const v = Number(a[k]); return Number.isFinite(v) ? clamp(v, lo, hi) : d; };
    return {
      date: typeof a.date === "string" ? a.date : "",
      valence: n("valence", 0, -1, 1),
      arousal: n("arousal", 0.5, 0, 1),
      tension: n("tension", 0.5, 0, 1),
      warmth:  n("warmth", 0.5, 0, 1),
      themes: Array.isArray(a.themes) ? a.themes.map(String) : []
    };
  }

  /** Same first theme → same seed → same melodic shape (leitmotif). */
  function seedFor(a) {
    a = normalizeAffect(a);
    if (a.themes[0]) return hash("theme:" + a.themes[0].trim().toLowerCase());
    return hash(`${a.date}|${a.valence}|${a.arousal}|${a.tension}|${a.warmth}`);
  }

  /* ── modes: valence picks brightness, tension darkens the dark end ───── */
  const MODES = {
    ionian:     [0, 2, 4, 5, 7, 9, 11],
    mixolydian: [0, 2, 4, 5, 7, 9, 10],
    dorian:     [0, 2, 3, 5, 7, 9, 10],
    aeolian:    [0, 2, 3, 5, 7, 8, 10],
    phrygian:   [0, 1, 3, 5, 7, 8, 10]
  };
  function modeFor(a) {
    if (a.valence > 0.35)  return "ionian";
    if (a.valence > 0.1)   return "mixolydian";
    if (a.valence > -0.1)  return "dorian";
    if (a.valence > -0.45) return "aeolian";
    return a.tension > 0.6 ? "phrygian" : "aeolian";
  }
  const isMinorish = (m) => m === "dorian" || m === "aeolian" || m === "phrygian";
  function degreeToMidi(rootMidi, mode, degree) {
    const oct = Math.floor(degree / 7), idx = ((degree % 7) + 7) % 7;
    return rootMidi + oct * 12 + mode[idx];
  }

  /* ── timbre: how the instruments are built from the affect ───────────── */
  function timbreFor(a) {
    return {
      oscillator: a.tension > 0.7 ? "sawtooth" : a.valence > 0.2 ? "triangle" : "sine",
      attack:  clamp(0.004 + (1 - a.tension) * 0.06 + a.warmth * 0.04, 0.004, 0.12),
      release: clamp(0.25 + a.warmth * 0.9 - a.tension * 0.1, 0.15, 1.3),
      cutoff:  clamp(700 + a.valence * 600 + (1 - a.warmth) * 1600 + a.arousal * 700, 450, 4800),
      reverbDecay: 1.2 + a.warmth * 4,
      reverbWet:   clamp(0.15 + a.warmth * 0.55, 0.1, 0.75),
      padLevel:    -22 + a.warmth * 8,                       // dB
      padAttack:   0.4 + a.warmth * 0.8,
      pulseLevel:  -20 + a.arousal * 6,                      // dB
      leadLevel:   -8 + a.arousal * 4
    };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     motifFor(affect, opts) → a MotifPlan. Pure and deterministic.
       opts.seed      override the melodic-shape seed
       opts.root      override the root MIDI note (composeWeek uses this)
       opts.beats     phrase length in beats (default 8 = two bars of 4/4)
     ═══════════════════════════════════════════════════════════════════════ */
  function motifFor(input, opts = {}) {
    const a = normalizeAffect(input);
    const seed = opts.seed != null ? opts.seed : seedFor(a);
    const rng = mulberry32(seed);                  // the SHAPE: same seed → same skeleton
    const rngVar = mulberry32(seed ^ 0x9e3779b9);  // affect-dependent variation, kept off the shape stream
    const beats = opts.beats || 8;

    const bpm = Math.round(60 + a.arousal * 75);
    const secPerBeat = 60 / bpm;
    const modeName = modeFor(a), mode = MODES[modeName];
    const rootMidi = opts.root != null ? opts.root : 60 + Math.round(a.valence * 3) - Math.round(a.warmth * 4);
    const timbre = timbreFor(a);

    // rhythm: a seeded skeleton of onsets on a half-beat grid (the leitmotif's
    // shape), then arousal thins it (calm) or fills it in (activated)
    const cells = beats * 2, onsets = [0];
    for (let k = 1; k < cells; k++) if (rng() < 0.58) onsets.push(k);
    let grid = onsets;
    if (a.arousal < 0.33) grid = onsets.filter((k, i) => k % 2 === 0 || i % 3 === 0);
    else if (a.arousal > 0.66) {
      const extra = [];
      for (const k of onsets) if (k + 0.5 < cells && rngVar() < (a.arousal - 0.66) * 1.8) extra.push(k + 0.5);
      grid = [...new Set([...onsets, ...extra])].sort((p, q) => p - q);
    }
    const rhythm = grid.map((k, i) => ((i + 1 < grid.length ? grid[i + 1] : cells) - k) / 2);

    // contour: mostly steps when tense, leaps when relaxed; drift follows valence
    const notes = [];
    const target = Math.round(a.valence * 4);
    const pStep = 0.5 + a.tension * 0.4;
    const pRest = Math.max(0, 0.22 - a.arousal * 0.2);
    let deg = rng() < 0.6 ? 0 : 4, time = 0;
    rhythm.forEach((d, i) => {
      const isLast = i === rhythm.length - 1;
      const rest = i > 0 && !isLast && rngVar() < pRest;
      if (!rest) {
        if (i > 0) {
          const progress = i / Math.max(1, rhythm.length - 1);
          const bias = clamp((target * progress - deg) * 0.3, -0.35, 0.35);
          const up = rng() < 0.5 + bias ? 1 : -1;
          const move = rng() < pStep ? 1 : [2, 3, 4][Math.floor(rng() * 3)];
          deg = clamp(deg + move * up, -3, 10);
        }
        let midi = degreeToMidi(rootMidi, mode, deg), accidental = 0;
        if (!isLast && a.tension > 0.55 && rngVar() < (a.tension - 0.5) * 0.7) {
          accidental = rngVar() < 0.5 ? -1 : 1; midi += accidental;  // a chromatic rub, resolved next
        }
        const onBeat = Math.abs(time - Math.round(time)) < 1e-6;
        const velocity = clamp(0.42 + a.arousal * 0.38 + (onBeat ? 0.08 : 0) + (rngVar() - 0.5) * 0.1, 0.2, 1);
        const legato = a.tension > 0.6 ? 0.55 : 0.8 + a.warmth * 0.18;
        notes.push({ beat: time, timeSec: time * secPerBeat, durBeats: d, durSec: d * legato * secPerBeat,
                     midi, degree: deg, accidental, velocity, name: noteName(midi, rootMidi) });
      }
      time += d;
    });

    // the ending: settle on the tonic when relaxed; leave it hanging when tense
    const last = notes[notes.length - 1];
    if (a.tension < 0.6) { last.degree = deg > 3 ? 7 : 0; }
    else                 { last.degree = deg > 3 ? 8 : 1; }
    last.accidental = 0;
    last.midi = degreeToMidi(rootMidi, mode, last.degree);
    last.name = noteName(last.midi, rootMidi);
    last.durSec = Math.max(last.durSec, (a.tension < 0.6 ? 1.4 : 0.9) * secPerBeat);

    // pad: two slow chords under the phrase
    const minor = isMinorish(modeName);
    const chordDegrees = [
      [0, 2, 4].concat(a.warmth > 0.5 ? [6] : []),                 // I (add 7 when warm)
      minor ? [-2, 0, 2] : [3, 5, 7]                               // VI in minor, IV in major
    ];
    const chords = chordDegrees.map((degs, k) => {
      const midis = degs.map(dg => degreeToMidi(rootMidi - 12, mode, dg));
      if (a.tension > 0.65) midis.push(rootMidi - 12 + 1);         // a b2 rubbed in, quietly
      return { beat: k * (beats / 2), timeSec: k * (beats / 2) * secPerBeat, durSec: (beats / 2) * secPerBeat * 1.05,
               midis, names: midis.map(m => noteName(m, rootMidi)), velocity: 0.22 + a.warmth * 0.2 };
    });

    // pulse: a soft plucked eighth-note ostinato when the day was activated
    const pulse = [];
    if (a.arousal > 0.55) {
      for (let b = 0; b < beats; b += 0.5) {
        const midi = rootMidi - 12 + (Math.round(b * 2) % 4 === 2 ? mode[4] : 0);
        pulse.push({ beat: b, timeSec: b * secPerBeat, midi, name: noteName(midi, rootMidi),
                     velocity: 0.2 + a.arousal * 0.3 + (b % 1 === 0 ? 0.08 : 0) });
      }
    }

    const phraseSec = beats * secPerBeat;
    return {
      affect: a, seed, bpm, secPerBeat, beats, mode: modeName, modeIntervals: mode,
      root: rootMidi, rootName: noteName(rootMidi, rootMidi).replace(/\d+$/, ""),
      notes, chords, pulse, timbre,
      phraseSec, durationSec: phraseSec + timbre.release + 0.6,
      describe() { return `${this.rootName} ${this.mode} · ${this.bpm} bpm · ${this.notes.length} notes`; }
    };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     weekPlan(entries) → the week as one piece. Pure.
     Each day is a motif (its shape seeded by its first theme), transposed so
     its register follows the valence line — the mood line is the melody line.
     ═══════════════════════════════════════════════════════════════════════ */
  function weekPlan(entries, opts = {}) {
    const sorted = (entries || []).map(normalizeAffect).filter(Boolean)
      .sort((x, y) => String(x.date).localeCompare(String(y.date)));
    const gapBeats = opts.gapBeats != null ? opts.gapBeats : 1;
    const days = [];
    let t = 0;
    for (const a of sorted) {
      const root = 60 + Math.round(a.valence * 5) - Math.round(a.warmth * 2);
      const plan = motifFor(a, { seed: seedFor(a), root });
      days.push({ affect: a, date: a.date, start: t, plan });
      t += plan.phraseSec + gapBeats * plan.secPerBeat;
    }
    const lastPlan = days.length ? days[days.length - 1].plan : null;
    const totalSec = t + (lastPlan ? lastPlan.timbre.release + lastPlan.timbre.reverbDecay * 0.4 : 0);
    // one shared instrument chain: average the timbre, modulate per day
    const avg = (k) => days.length ? days.reduce((s, d) => s + d.plan.timbre[k], 0) / days.length : 0;
    const timbre = days.length ? Object.assign({}, days[0].plan.timbre, {
      reverbDecay: avg("reverbDecay"), reverbWet: avg("reverbWet"), release: avg("release"), attack: avg("attack")
    }) : timbreFor(normalizeAffect({}));
    return { days, totalSec, timbre };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     Playback (needs Tone)
     ═══════════════════════════════════════════════════════════════════════ */
  const hasTone = () => typeof Tone !== "undefined";
  const transport = () => (Tone.getTransport ? Tone.getTransport() : Tone.Transport);
  const draw = () => (Tone.getDraw ? Tone.getDraw() : Tone.Draw);
  // visual callback at audio time `time`: Tone.Draw (frame-accurate) with a timer
  // fallback, so onNote/onEnd still fire when frames are throttled (hidden tab)
  const later = (cb, time) => {
    let done = false;
    const run = () => { if (!done) { done = true; cb(); } };
    try { draw().schedule(run, time); } catch { /* fall through to the timer */ }
    setTimeout(run, Math.max(0, (time - Tone.now()) * 1000) + 80);
  };

  let current = null;       // active handle
  let prepared = null;      // { plan, promise<chain> } built ahead of time by prepare()
  let surface = null;       // vinyl surface-noise nodes
  let started = false;

  async function ready() {
    if (!hasTone()) throw new Error("Tone.js is not loaded");
    if (!started) { await Tone.start(); started = true; }
    return true;
  }

  async function buildChain(timbre) {
    const master = new Tone.Volume(-4).toDestination();
    const reverb = new Tone.Reverb({ decay: timbre.reverbDecay, wet: timbre.reverbWet, preDelay: 0.02 });
    await (reverb.ready || reverb.generate());
    reverb.connect(master);
    const filter = new Tone.Filter({ frequency: timbre.cutoff, type: "lowpass", rolloff: -12, Q: 0.6 }).connect(reverb);
    const lead = new Tone.PolySynth(Tone.Synth, {
      maxPolyphony: 8, volume: timbre.leadLevel,
      oscillator: { type: timbre.oscillator },
      envelope: { attack: timbre.attack, decay: 0.18, sustain: 0.5, release: timbre.release }
    }).connect(filter);
    const pad = new Tone.PolySynth(Tone.Synth, {
      maxPolyphony: 10, volume: timbre.padLevel,
      oscillator: { type: "sine" },
      envelope: { attack: timbre.padAttack, decay: 0.3, sustain: 0.85, release: 2.4 }
    }).connect(filter);
    const pulse = new Tone.PluckSynth({ attackNoise: 0.6, dampening: 2600, resonance: 0.86, volume: timbre.pulseLevel }).connect(reverb);
    const nodes = [lead, pad, pulse, filter, reverb, master];
    return {
      lead, pad, pulse, filter, reverb,
      applyTimbre(t, time) {   // per-day modulation for composeWeek
        filter.frequency.setValueAtTime(t.cutoff, time);
        reverb.wet.setValueAtTime(t.reverbWet, time);
        lead.set({ oscillator: { type: t.oscillator }, envelope: { attack: t.attack, release: t.release } });
        lead.volume.setValueAtTime(t.leadLevel, time);
        pad.volume.setValueAtTime(t.padLevel, time);
        pulse.volume.setValueAtTime(t.pulseLevel, time);
      },
      releaseAll(time) { lead.releaseAll(time); pad.releaseAll(time); },
      dispose() { nodes.forEach(n => { try { n.dispose(); } catch { /* already gone */ } }); }
    };
  }

  /** Schedule one plan at `offset` seconds on the Transport. */
  function schedulePlan(plan, chain, offset, cb = {}) {
    const T = transport();
    for (const n of plan.notes) {
      T.schedule((time) => {
        chain.lead.triggerAttackRelease(n.name, n.durSec, time, n.velocity);
        if (cb.onNote) later(() => cb.onNote(n, plan), time);
      }, offset + n.timeSec);
    }
    for (const c of plan.chords) {
      T.schedule((time) => chain.pad.triggerAttackRelease(c.names, c.durSec, time, c.velocity), offset + c.timeSec);
    }
    for (const p of plan.pulse) {
      T.schedule((time) => chain.pulse.triggerAttackRelease(p.name, "8n", time, p.velocity), offset + p.timeSec);
    }
  }

  function resetTransport() {
    const T = transport();
    T.stop(); T.cancel(0); T.seconds = 0;
  }

  function makeHandle(chain, totalSec, cb) {
    const T = transport();
    let finished = false, stopped = false;
    let resolveDone;
    const done = new Promise(r => { resolveDone = r; });
    const handle = {
      chain, totalSec, done,
      get position() { return T.seconds; },
      get playing() { return T.state === "started"; },
      pause() { if (T.state === "started") T.pause(); },
      resume() { if (T.state === "paused") T.start(); },
      stop() {
        if (stopped) return; stopped = true;
        try { chain.releaseAll(); } catch { /* ok */ }
        resetTransport();
        setTimeout(() => chain.dispose(), 3000);
        if (!finished) { finished = true; resolveDone({ completed: false }); }
        if (current === handle) current = null;
      }
    };
    T.scheduleOnce(() => later(() => {
      if (finished) return;
      finished = true;
      if (cb.onEnd) cb.onEnd();
      resolveDone({ completed: true });
      setTimeout(() => { if (current === handle) { T.stop(); T.cancel(0); current = null; } chain.dispose(); }, 2500);
    }, Tone.now()), totalSec);
    return handle;
  }

  /**
   * Play one day. Resolves to a handle once audio is scheduled and started.
   *   opts.plan    reuse a plan from motifFor (so visuals and audio agree)
   *   opts.onNote(note, plan)  fires as each melody note sounds (for drifting glyphs)
   *   opts.onEnd()             fires when the phrase and its tail are over
   */
  /**
   * Build the instrument chain ahead of time (reverb impulse generation takes a
   * moment). Call it from the user's click while the visuals run; playMotif
   * with the same `plan` object then starts instantly.
   */
  async function prepare(affect, opts = {}) {
    await ready();
    const plan = opts.plan || motifFor(affect, opts);
    if (prepared && prepared.plan === plan) return prepared.promise;
    if (prepared) prepared.promise.then(c => c.dispose()).catch(() => {});
    prepared = { plan, promise: buildChain(plan.timbre) };
    return prepared.promise;
  }

  async function playMotif(affect, opts = {}) {
    await ready();
    stop();
    const plan = opts.plan || motifFor(affect, opts);
    let chain;
    if (prepared && prepared.plan === plan) { chain = await prepared.promise; prepared = null; }
    else chain = await buildChain(plan.timbre);
    resetTransport();
    const lead = 0.08;
    schedulePlan(plan, chain, lead, opts);
    const handle = makeHandle(chain, lead + plan.durationSec, opts);
    handle.plan = plan;
    current = handle;
    transport().start("+0.05");
    return handle;
  }

  /**
   * Compose the week: every entry's motif in date order, one continuous piece.
   *   opts.onDay(day, index)   fires when a day's motif begins
   *   opts.onNote / opts.onEnd as in playMotif
   */
  async function composeWeek(entries, opts = {}) {
    await ready();
    stop();
    const week = opts.week || weekPlan(entries, opts);
    if (!week.days.length) throw new Error("composeWeek: no entries");
    const chain = await buildChain(week.timbre);
    resetTransport();
    const T = transport(), lead = 0.08;
    week.days.forEach((day, i) => {
      T.schedule((time) => {
        chain.applyTimbre(day.plan.timbre, time);
        if (opts.onDay) later(() => opts.onDay(day, i), time);
      }, lead + day.start);
      schedulePlan(day.plan, chain, lead + day.start, opts);
    });
    const handle = makeHandle(chain, lead + week.totalSec, opts);
    handle.week = week;
    current = handle;
    T.start("+0.05");
    return handle;
  }

  function stop() { if (current) current.stop(); }
  function pause() { if (current) current.pause(); }
  function resume() { if (current) current.resume(); }
  function position() { return current ? current.position : 0; }
  function isPlaying() { return !!current && current.playing; }

  /* ── vinyl foley: needle drop + surface noise ────────────────────────── */
  async function needleDrop() {
    await ready();
    const now = Tone.now();
    const click = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0 }, volume: -20 }).toDestination();
    const thump = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 3, envelope: { attack: 0.001, decay: 0.25, sustain: 0 }, volume: -16 }).toDestination();
    click.triggerAttackRelease(0.05, now);
    thump.triggerAttackRelease("A1", 0.25, now + 0.01, 0.8);
    setTimeout(() => { click.dispose(); thump.dispose(); }, 1500);
  }

  async function startSurfaceNoise(level = -38) {
    await ready();
    stopSurfaceNoise();
    const vol = new Tone.Volume(level).toDestination();
    const filt = new Tone.Filter({ frequency: 2200, type: "bandpass", Q: 0.4 }).connect(vol);
    const noise = new Tone.Noise("brown").connect(filt);
    const lfo = new Tone.LFO({ frequency: 0.55, min: level - 6, max: level + 2 }).connect(vol.volume);
    noise.start(); lfo.start();
    surface = { noise, filt, vol, lfo };
  }
  function stopSurfaceNoise() {
    if (!surface) return;
    const s = surface; surface = null;
    try { s.vol.volume.rampTo(-80, 0.6); } catch { /* ok */ }
    setTimeout(() => { [s.noise, s.lfo, s.filt, s.vol].forEach(n => { try { n.dispose(); } catch { /* ok */ } }); }, 800);
  }

  return {
    // planning (pure)
    motifFor, weekPlan, seedFor, normalizeAffect, modeFor, timbreFor, noteName, MODES,
    // playback
    ready, prepare, playMotif, composeWeek, stop, pause, resume, position, isPlaying,
    needleDrop, startSurfaceNoise, stopSurfaceNoise,
    get current() { return current; }
  };
});
</script>


<!-- ═══════════════════════════════════════════════════════════════════════
     SCENE — render an AffectEntry onto the desk (PRD §5.2, §10.2), and host
     journal-input so every day on the rail can be written, spoken, marked.
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="scene">
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const MS_PER_WORD = 28, INK_FADE = 460, HL_STEP = 360, HL_DUR = 520;
  const STORE_KEY = "composure.entries";
  const KEEP = ["_auto_words", "_analysis", "_user"];      // module bookkeeping validateAffect would drop

  /* ── entries: the seeded week, with the writer's own saved over it ── */
  const loadSaved = () => { try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); return Array.isArray(s) ? s : []; } catch { return []; } };
  const keep = (a, raw) => { for (const k of KEEP) if (raw && raw[k] !== undefined) a[k] = raw[k]; return a; };
  const state = { entries: SEEDED_ENTRIES.slice(), current: null };
  for (const raw of loadSaved()) {
    const a = keep(validateAffect(raw), raw);
    const i = state.entries.findIndex(e => e.date === a.date);
    if (i >= 0) state.entries[i] = a; else state.entries.push(a);
  }
  state.entries.sort((x, y) => x.date.localeCompare(y.date));
  const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state.entries.filter(e => e._user))); } catch { /* private mode */ } };

  /* ── dates ── */
  const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
  const isoOf = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
  const headDate = (iso) => parse(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  const longDate = (iso) => parse(iso).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const mondayOf = (iso) => { const d = parse(iso); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d; };
  const fmt = (n, signed) => (signed && n > 0 ? "+ " : n < 0 ? "− " : "") + Math.abs(n).toFixed(1);

  const nb = $("notebook"), body = $("body");

  /** Render one AffectEntry. Left page = the words; everything else is derived.
   *  opts.keepBody: the page is being typed on — refresh the right page only. */
  function renderEntry(raw, opts = {}) {
    const a = keep(validateAffect(raw), raw);
    state.current = a;
    const wasBlank = nb.dataset.blank === "true";
    nb.dataset.blank = "false";
    const ink = inkFor(a);
    nb.style.setProperty("--ink", ink.hex);
    nb.dataset.ink = ink.name;

    // ── left page ──
    $("dateline").textContent = headDate(a.date);
    $("timeline").textContent = a.time;
    let tHl = 0, tRight = 0;
    if (!opts.keepBody) {
      const { html, words, highlights } = JournalInput.markup(a.text, a.emotional_words);
      body.classList.remove("no-anim", "writing", "highlighting");
      body.innerHTML = html;
      tHl = words * MS_PER_WORD + INK_FADE + 300;
      tRight = tHl + Math.max(1, highlights) * HL_STEP + HL_DUR + 400;
    }
    nb.style.setProperty("--t-hl", tHl + "ms");
    nb.style.setProperty("--t-right", tRight + "ms");
    nb.classList.toggle("live", !!opts.keepBody);

    // ── right page: computed ──
    $("mood-name").textContent = a.mood_name;
    $("coords").innerHTML =
      `<span>valence</span><b>${fmt(a.valence, true)}</b><span>arousal</span><b>${fmt(a.arousal)}</b>` +
      `<span>tension</span><b>${fmt(a.tension)}</b><span>warmth</span><b>${fmt(a.warmth)}</b>`;
    $("descriptor").textContent = a.descriptor;
    const rot = [-2, 1.5, -1, 2, -1.5, 1];
    $("tags").innerHTML = a.mood_tags.map((t, k) => `<span class="tag" style="--k:${k};--r:${rot[k % rot.length]}deg">${esc(t)}</span>`).join("");
    $("drink-name").textContent = a.drink.name;
    $("drink-reason").textContent = a.drink.reason;

    // ── desk: the pink quote scrap and what's in the cup ──
    $("song-quote").textContent = a.song_quote;
    const cup = $("cup"), c = CUP_COLORS[a.drink.family] || CUP_COLORS.herbal;
    cup.dataset.family = a.drink.family;
    cup.style.setProperty("--liq-hi", c.hi); cup.style.setProperty("--liq", c.mid); cup.style.setProperty("--liq-lo", c.lo);

    markRail(a.date);
    // restart the CSS animations on nodes we reuse (not while typing, unless the page was blank)
    if (!opts.keepBody || wasBlank) document.querySelectorAll(".scrap, .tags-head, .drink").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
    return a;
  }

  /** An empty day: the dateline, blank scraps taped on, the plate's tea in the cup. */
  function renderBlank(e) {
    state.current = null;
    nb.dataset.blank = "true"; nb.classList.remove("live");
    nb.style.setProperty("--ink", "#282725"); nb.dataset.ink = "black";
    nb.style.setProperty("--t-hl", "0ms"); nb.style.setProperty("--t-right", "0ms");
    $("dateline").textContent = headDate(e.date);
    $("timeline").textContent = "";
    $("mood-name").textContent = "";
    $("coords").innerHTML = `<span>valence</span><b>—</b><span>arousal</span><b>—</b><span>tension</span><b>—</b><span>warmth</span><b>—</b>`;
    $("descriptor").textContent = "the right page writes itself once there are words on the left.";
    $("tags").innerHTML = "";
    $("drink-name").textContent = ""; $("drink-reason").textContent = "";
    $("song-quote").textContent = "";
    const cup = $("cup"); cup.dataset.family = "herbal";
    markRail(e.date);
    document.querySelectorAll(".scrap").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
  }

  const markRail = (date) => document.querySelectorAll(".day").forEach(b => b.setAttribute("aria-current", b.dataset.date === date ? "true" : "false"));

  /** The week rail is built around the week of the newest entry. Every day opens. */
  function renderRail() {
    const newest = state.entries[state.entries.length - 1] || { date: isoOf(new Date()) };
    const mon = mondayOf(newest.date);
    const byDate = new Map(state.entries.map(e => [e.date, e]));
    const items = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      const iso = isoOf(d), e = byDate.get(iso);
      const wd = d.toLocaleDateString("en-US", { weekday: "short" });
      items.push(
        `<li><button class="day" type="button" data-date="${iso}" data-has-entry="${!!e}"
            aria-label="${esc(wd)}, ${longDate(iso)}${e ? ", " + esc(e.title) + ", open entry" : ", write an entry"}">
           <span class="dot"></span><span class="txt"><span class="wd">${esc(wd)}</span><span class="cap${e ? "" : " empty"}">${e ? esc(e.title) : "write…"}</span></span>
         </button></li>`);
    }
    $("rail").innerHTML = items.join("");
    const cur = state.current ? state.current.date : JournalInput.state.date;
    if (cur) markRail(cur);
  }

  /** Add or replace an entry, then (optionally) show it. */
  function addEntry(raw, show = true) {
    const a = keep(validateAffect(raw), raw);
    const i = state.entries.findIndex(e => e.date === a.date);
    if (i >= 0) state.entries[i] = a; else state.entries.push(a);
    state.entries.sort((x, y) => x.date.localeCompare(y.date));
    renderRail();
    if (show) renderEntry(a);
    return a;
  }
  const getEntry = (date) => state.entries.find(e => e.date === date) || null;

  /* ── host journal-input: write, speak, highlight on the left page ── */
  JournalInput.mount({
    body, status: $("status"),
    tools: { pen: $("tool-pen"), highlighter: $("tool-hl"), mic: $("tool-mic") },
    getEntry,
    saveEntry(e) { e._user = true; const a = addEntry(e, false); persist(); return a; },
    onRender(e, opts) { if (e._blank) renderBlank(e); else renderEntry(e, opts); },
    placeholder: "what did today feel like? write here, or tap the mic…",
    debounceMs: 900
  });
  $("rail").addEventListener("click", (ev) => {
    const b = ev.target.closest(".day"); if (!b) return;
    if (document.documentElement.classList.contains("transposing")) window.Transpose.reset();
    JournalInput.open(b.dataset.date);
  });

  // Public surface for later steps (transpose, calendar)
  window.Composure = {
    AFFECT_SCHEMA, validateAffect, inkFor, tintFor, renderEntry, addEntry, getEntry, state,
    reset() { localStorage.removeItem(STORE_KEY); localStorage.removeItem("composure.manual-highlights"); location.reload(); }
  };

  renderRail();
  JournalInput.open(state.entries[state.entries.length - 1].date);
})();
</script>


<!-- ═══════════════════════════════════════════════════════════════════════
     PLATE — fit the fixed artboard to the viewport; fit the handwriting to
     the page. Presentation only: no affect data, no derivation.
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="plate">
(() => {
  const board = document.getElementById("artboard");
  const fitArtboard = () => board.style.setProperty("--s", Math.min(window.innerWidth / 1536, window.innerHeight / 1024));
  fitArtboard();
  window.addEventListener("resize", fitArtboard);

  // Handwriting fills the page; a long entry writes a little smaller rather than running off it.
  const body = document.getElementById("body");
  let raf = 0;
  const fitBody = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      let fs = 29;
      body.style.setProperty("--fs", fs + "px");
      while (fs > 21 && body.scrollHeight > body.clientHeight + 1) { fs -= .5; body.style.setProperty("--fs", fs + "px"); }
    });
  };
  new MutationObserver(fitBody).observe(body, { childList: true, characterData: true, subtree: true });
  document.fonts?.ready.then(fitBody);
  fitBody();
})();
</script>


<!-- ═══════════════════════════════════════════════════════════════════════
     TRANSPOSE — "Transpose this into a song" (PRD §5.6, §5.7)
     Four beats, one continuous hand-drawn morph, in artboard px:
       1. words lift off the page and land as notes on a staff (the engine's real notes)
       2. the sheet curls and rolls into a record
       3. the record travels to the turntable and settles onto the plate's LP
       4. the needle drops; Tone.js plays; the LP spins; notes drift up
     Ported from transpose.html (1180×660 rem stage → 1536×1024 px artboard).
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="transpose">
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeInOut = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  // rAF that keeps ticking (≈8 fps) if frames are throttled, e.g. the tab is briefly hidden
  const nextFrame = (cb) => {
    let done = false;
    const id = requestAnimationFrame((t) => { if (!done) { done = true; cb(t); } });
    setTimeout(() => { if (!done) { done = true; cancelAnimationFrame(id); cb(performance.now()); } }, 120);
  };

  const board = $("artboard"), body = $("body"), turntable = $("turntable-mount");
  // screen px → artboard px (the artboard is a scaled 1536×1024 coordinate system)
  const toBoard = (x, y) => { const r = board.getBoundingClientRect(), s = r.width / 1536; return [(x - r.left) / s, (y - r.top) / s]; };
  const SHEET = { left: 278, top: 330, w: 420, h: 180, D: 220 };   // where the sheet appears over the page; D = the record's diameter mid-flight
  const DISC  = { cx: 1375, cy: 115, d: 639, k: 0.8841 };   // the plate's LP: spindle, diameter, vertical squash
  const SPIN_MS = 6000;                                             // matches @keyframes recordSpin
  const spinT = (deg) => `scale(1, ${DISC.k}) rotate(${deg}deg)`;

  /* ── staff geometry (SVG user units == artboard px at the sheet's natural size) ── */
  const STAFF = { x0: 60, x1: 400, top: 55, gap: 14, w: 420, h: 180 };
  const LETTER_STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  function staffY(name) {                    // treble staff: bottom line is E4 (step 2 above C4)
    const m = /^([A-G])([#b]?)(-?\d+)$/.exec(name);
    const step = (parseInt(m[3], 10) - 4) * 7 + LETTER_STEP[m[1]];
    const bottom = STAFF.top + STAFF.gap * 4;
    return { y: bottom - (step - 2) * (STAFF.gap / 2), acc: m[2] };
  }
  function noteX(beat, beats) { return STAFF.x0 + 24 + (beat / beats) * (STAFF.x1 - STAFF.x0 - 40); }

  /** A hand-drawn note glyph as SVG markup, centred on (0,0). */
  function glyphMarkup(n, acc) {
    const g = STAFF.gap, hollow = n.durBeats >= 2, stemUp = staffY(n.name).y > STAFF.top + g * 2;
    const stem = stemUp ? `M ${g * .55} -1 v ${-g * 3.1}` : `M ${-g * .55} 1 v ${g * 3.1}`;
    const flag = n.durBeats < 1 ? (stemUp
      ? `M ${g * .55} ${-g * 3.1} c 10 6, 12 12, 6 22`
      : `M ${-g * .55} ${g * 3.1} c 10 -6, 12 -12, 6 -22`) : "";
    const accT = acc ? `<text x="${-g * 1.9}" y="${g * .45}">${acc === "#" ? "♯" : "♭"}</text>` : "";
    return `<g class="note-glyph${hollow ? " hollow" : ""}" filter="url(#wobble)">
      <ellipse rx="${g * .62}" ry="${g * .42}" transform="rotate(-22)"/>
      <path d="${stem} ${flag}" fill="none"/>${accT}</g>`;
  }

  function drawStaff(plan) {
    const svg = $("staff");
    svg.setAttribute("viewBox", `0 0 ${STAFF.w} ${STAFF.h}`);
    let s = "";
    for (let i = 0; i < 5; i++) {
      const y = STAFF.top + i * STAFF.gap;
      s += `<path class="line draw" data-line="${i}" pathLength="1" d="${lineD(y)}" style="transition: stroke-dashoffset .9s ease ${i * 90}ms"/>`;
    }
    s += `<path class="clef draw" pathLength="1" style="transition: stroke-dashoffset 1.1s ease .4s" filter="url(#wobble)"
           d="M ${STAFF.x0 + 8} ${STAFF.top + 74} c -6 -8, -4 -20, 6 -26 c 12 -6, 14 -22, 6 -34 c -8 10, -10 26, -6 52 c 2 14, 4 20, 0 28
              M ${STAFF.x0 + 10} ${STAFF.top + 20} c 12 4, 10 22, -2 24 c -10 2, -14 -10, -6 -14 c 6 -2, 10 4, 6 8"/>`;
    s += `<line class="bar draw" pathLength="1" style="transition: stroke-dashoffset .5s ease .6s" x1="${STAFF.x1}" y1="${STAFF.top}" x2="${STAFF.x1}" y2="${STAFF.top + STAFF.gap * 4}"/>`;
    const mid = STAFF.x0 + 24 + (STAFF.x1 - STAFF.x0 - 40) / 2 - 8;
    s += `<line class="bar draw" pathLength="1" style="transition: stroke-dashoffset .5s ease .5s" x1="${mid}" y1="${STAFF.top}" x2="${mid}" y2="${STAFF.top + STAFF.gap * 4}"/>`;
    s += `<g id="notes"></g>`;
    svg.innerHTML = s;
    nextFrame(() => svg.querySelectorAll(".draw").forEach(el => el.style.strokeDashoffset = "0"));
  }
  const SAMPLES = 48;   // straight staff line sampled into points, so it can bend into a groove later
  function lineD(y) {
    const pts = []; for (let k = 0; k <= SAMPLES; k++) pts.push([STAFF.x0 + (STAFF.x1 - STAFF.x0) * k / SAMPLES, y]);
    return "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  }
  function morphD(i, e, cx, cy) {              // line i, progress e: straight → ring around (cx,cy)
    const y = STAFF.top + i * STAFF.gap, r = 22 + i * 12, pts = [];
    for (let k = 0; k <= SAMPLES; k++) {
      const t = k / SAMPLES, sx = STAFF.x0 + (STAFF.x1 - STAFF.x0) * t, ang = -Math.PI / 2 + t * Math.PI * 2;
      const rx = cx + Math.cos(ang) * r, ry = cy + Math.sin(ang) * r;
      pts.push([sx + (rx - sx) * e, y + (ry - y) * e]);
    }
    return "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  }

  /* ── beat 1: words lift and become notes ──────────────────────────── */
  const isHl = (w) => !!w.closest(".hl");
  async function wordsToNotes(plan, wordEls) {
    const sheet = $("sheet"), flyers = $("flyers");
    sheet.style.opacity = "1";
    drawStaff(plan);
    await wait(reduced ? 0 : 500);

    // which word plays which note: highlighted words take the loudest notes
    const order = plan.notes.map((n, i) => i).sort((a, b) => plan.notes[b].velocity - plan.notes[a].velocity);
    const hlWords = wordEls.filter(isHl), plain = wordEls.filter(w => !isHl(w));
    const assign = new Map();   // note index → word el
    hlWords.forEach((w, k) => { if (k < order.length) assign.set(order[k], w); });
    let pi = 0;
    for (let i = 0; i < plan.notes.length; i++) if (!assign.has(i)) {
      const step = Math.max(1, Math.floor(plain.length / plan.notes.length));
      assign.set(i, plain[Math.min(plain.length - 1, pi)]); pi += step;
    }
    const used = new Set(assign.values());
    const sr = sheet.getBoundingClientRect(), [sx, sy] = toBoard(sr.left, sr.top);
    const fs = getComputedStyle(body).getPropertyValue("--fs") || "29px";
    const flights = [];

    wordEls.forEach((w, wi) => {
      const noteIdx = [...assign.entries()].find(([, el]) => el === w)?.[0];
      const r = w.getBoundingClientRect(), [x0, y0] = toBoard(r.left, r.top);
      const nIdx = noteIdx != null ? noteIdx : Math.floor(wi / wordEls.length * plan.notes.length);
      const n = plan.notes[Math.min(nIdx, plan.notes.length - 1)], { y: ny, acc } = staffY(n.name);
      const tx = sx + noteX(n.beat, plan.beats), ty = sy + ny;
      const el = document.createElement("div"); el.className = "flyer"; el.style.setProperty("--fs", fs);
      el.innerHTML = `<span class="txt${isHl(w) ? " hl" : ""}">${esc(w.textContent)}</span>` +
        `<svg viewBox="-30 -60 60 120">${glyphMarkup(n, acc)}</svg>`;
      flyers.appendChild(el);
      const delay = wi * 38, dur = reduced ? 1 : 1150, lift = 30 + (wi % 3) * 14, becomesNote = used.has(w);
      const mx = (x0 + tx) / 2, my = Math.min(y0, ty) - lift;
      const kf = [
        { transform: `translate(${x0}px,${y0}px) rotate(0deg)`, offset: 0 },
        { transform: `translate(${mx}px,${my}px) rotate(${-6 + (wi % 5) * 3}deg)`, offset: .5 },
        { transform: `translate(${tx}px,${ty}px) rotate(0deg)`, offset: 1 }
      ];
      setTimeout(() => w.classList.add("lifted"), delay);
      const anim = el.animate(kf, { duration: dur, delay, easing: "cubic-bezier(.35,.05,.2,1)", fill: "both" });
      const txt = el.querySelector(".txt"), svg = el.querySelector("svg");
      txt.animate([{ opacity: 1, transform: "scale(1)", offset: 0 }, { opacity: 1, offset: .3 }, { opacity: 0, transform: "scale(.6)", offset: .7 }], { duration: dur, delay, fill: "both" });
      if (becomesNote) svg.animate([{ opacity: 0, transform: "scale(.4)", offset: 0 }, { opacity: 0, offset: .38 }, { opacity: 1, transform: "scale(1)", offset: .8 }], { duration: dur, delay, fill: "both" });
      else el.animate([{ opacity: 1, offset: 0 }, { opacity: 1, offset: .45 }, { opacity: 0, offset: .8 }], { duration: dur, delay, fill: "both" });
      flights.push(anim.finished.then(() => {
        if (becomesNote) {   // hand the note to the staff
          $("notes").insertAdjacentHTML("beforeend",
            `<g class="placed" data-i="${nIdx}" transform="translate(${noteX(n.beat, plan.beats)} ${ny})">${glyphMarkup(n, acc)}</g>`);
        }
        el.remove();
      }).catch(() => {}));
    });
    await Promise.all(flights);
    await wait(reduced ? 0 : 350);
  }

  /* ── beat 2: the sheet curls into a record ────────────────────────── */
  function sheetToRecord(alive) {
    return new Promise(resolve => {
      const sheet = $("sheet"), paper = sheet.querySelector(".paper"), vinyl = sheet.querySelector(".vinyl"), label = sheet.querySelector(".label");
      const lines = [...sheet.querySelectorAll(".line")], notes = [...sheet.querySelectorAll(".placed")];
      const clef = sheet.querySelector(".clef"), bars = [...sheet.querySelectorAll(".bar")];
      const W0 = SHEET.w, H0 = SHEET.h, D = SHEET.D;
      const cx0 = SHEET.left + W0 / 2, cy0 = SHEET.top + H0 / 2;   // sheet centre in artboard px
      const cx = STAFF.w / 2, cy = STAFF.h / 2;                    // in staff SVG units
      const dur = reduced ? 1 : 1700, t0 = performance.now();
      const notePos = notes.map(g => { const m = /translate\(([\d.]+) ([\d.]+)\)/.exec(g.getAttribute("transform")); return [+m[1], +m[2]]; });

      function frame(now) {
        if (!alive()) return resolve();
        const t = Math.min(1, (now - t0) / dur), e = easeInOut(t);
        const w = lerp(W0, D, e), h = lerp(H0, D, e), rad = lerp(4, D / 2, easeOut(Math.max(0, (t - .15) / .85)));
        const tilt = Math.sin(Math.min(1, t / .55) * Math.PI) * 22, roll = easeOut(Math.max(0, (t - .45) / .55)) * 300;
        sheet.style.width = w + "px"; sheet.style.height = h + "px"; sheet.style.borderRadius = rad + "px";
        sheet.style.left = (cx0 - w / 2) + "px"; sheet.style.top = (cy0 - h / 2) + "px";
        sheet.style.transform = `perspective(900px) rotateX(${-tilt}deg) rotate(${roll}deg)`;
        lines.forEach((ln, i) => ln.setAttribute("d", morphD(i, e, cx, cy)));
        notes.forEach((g, i) => {
          const [x, y] = notePos[i], ang = -Math.PI / 2 + (i / notes.length) * Math.PI * 2 + e * 1.4, r = lerp(0, 30, 1 - e);
          const tx = lerp(x, cx + Math.cos(ang) * r, e), ty = lerp(y, cy + Math.sin(ang) * r, e);
          g.setAttribute("transform", `translate(${tx} ${ty}) scale(${lerp(1, .25, e)})`);
          g.style.opacity = String(1 - Math.max(0, (t - .55) / .35));
        });
        const fadeEarly = String(Math.max(0, 1 - t / .4));
        if (clef) clef.style.opacity = fadeEarly; bars.forEach(b => b.style.opacity = fadeEarly);
        const v = Math.max(0, Math.min(1, (t - .35) / .5));
        vinyl.style.opacity = String(v); paper.style.opacity = String(1 - v);
        lines.forEach(ln => ln.style.opacity = String(1 - Math.max(0, (t - .75) / .25)));
        const l = Math.max(0, (t - .7) / .3);
        label.style.opacity = String(l); label.style.transform = `translate(-50%,-50%) scale(${lerp(.6, 1, easeOut(l))})`;
        if (t < 1) nextFrame(frame);
        else { sheet.querySelector(".staff").style.display = "none"; sheet.style.transform = `rotate(${roll}deg)`; resolve(); }
      }
      nextFrame(frame);
    });
  }

  /* ── beat 3: the record travels to the turntable and settles on the plate's LP ── */
  async function recordToTurntable() {
    const sheet = $("sheet");
    const sr = sheet.getBoundingClientRect(), [scx, scy] = toBoard(sr.left + sr.width / 2, sr.top + sr.height / 2);
    const dx = DISC.cx - scx, dy = DISC.cy - scy, target = DISC.d / SHEET.D;
    const dur = reduced ? 1 : 1400;
    await sheet.animate([
      { transform: `translate(0,0) rotate(300deg) scale(1)`, filter: "drop-shadow(0 6px 8px rgba(0,0,0,.18))", offset: 0 },
      { transform: `translate(${dx * .5}px, ${dy * .5 - 70}px) rotate(420deg) scale(${lerp(1, target, .5) * 1.08})`, filter: "drop-shadow(0 30px 24px rgba(0,0,0,.28))", offset: .5 },
      { transform: `translate(${dx}px, ${dy}px) rotate(540deg) scale(${target})`, filter: "drop-shadow(0 3px 5px rgba(0,0,0,.25))", offset: 1 }
    ], { duration: dur, easing: "cubic-bezier(.45,.02,.25,1)", fill: "forwards" }).finished;
    await sheet.animate([{ transform: `translate(${dx}px, ${dy}px) rotate(540deg) scale(${target * 1.02})` }, { transform: `translate(${dx}px, ${dy}px) rotate(540deg) scale(${target})` }],
      { duration: reduced ? 1 : 180, easing: "ease-out", fill: "forwards" }).finished;
    // it becomes the LP that was already there: the plate's disc lifts into its spin layer as the drawn one fades
    turntable.classList.add("playing");
    await sheet.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduced ? 1 : 600, easing: "ease-in", fill: "forwards" }).finished;
  }

  /* ── beat 4: the needle drops, the record spins, the song plays ───── */
  let handle = null, raf = 0, totalSec = 0;
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const controlsOn = (text, total) => {
    totalSec = total;
    $("planText").textContent = text;
    $("time").textContent = `0:00 / ${fmtTime(total)}`;
    $("controls").classList.add("on");
    $("pp").textContent = "❚❚"; $("pp").setAttribute("aria-label", "Pause");
  };
  const tick = () => {
    if (!handle) return;
    $("time").textContent = `${fmtTime(Math.min(handle.position, totalSec))} / ${fmtTime(totalSec)}`;
    raf = requestAnimationFrame(tick);
  };
  async function needleAndPlay(plan, alive) {
    controlsOn(plan.describe(), plan.durationSec);
    if (typeof Tone === "undefined") { status("audio unavailable (Tone.js did not load) — animation only"); return; }
    try {
      await ToneEngine.needleDrop();
      await ToneEngine.startSurfaceNoise(-40 + plan.affect.warmth * -4);
      await wait(250);
      if (!alive()) return;
      const h = await ToneEngine.playMotif(plan.affect, { plan, onNote: (n) => { if (alive()) driftNote(n); }, onEnd: () => { if (alive()) finish(); } });
      if (!alive()) { h.stop(); return; }
      handle = h; tick();
    } catch (err) { status("audio error: " + err.message); }
  }
  function driftNote(n) {
    // rise from the visible face of the LP (artboard px), clear of the notebook's corner
    const x = DISC.cx - 170 + Math.random() * 300, y = 150 + Math.random() * 200;
    const el = document.createElement("div"); el.className = "drift";
    el.textContent = ["♪", "♩", "♫", "♬"][Math.floor(Math.random() * 4)];
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.fontSize = (20 + n.velocity * 16) + "px";
    $("flyers").appendChild(el);
    el.animate([{ transform: "translate(0,0) rotate(-6deg)", opacity: 0 }, { opacity: .9, offset: .15 }, { transform: `translate(${(Math.random() - .5) * 40}px, -90px) rotate(8deg)`, opacity: 0 }],
      { duration: 2200 + n.durSec * 600, easing: "ease-out", fill: "forwards" }).finished.then(() => el.remove()).catch(() => {});
  }
  /** Let the record coast to a stop — exactly at its resting orientation, so the plate takes over seamlessly. */
  function coastToRest() {
    const disc = turntable.querySelector(".record-disc");
    const a = disc.getAnimations()[0];
    const angle = a ? ((a.currentTime % SPIN_MS) / SPIN_MS) * 360 : 0;
    const rest = angle > 300 ? 720 : 360;
    disc.style.animation = "none";
    return disc.animate([{ transform: spinT(angle) }, { transform: spinT(rest) }],
      { duration: reduced ? 1 : 900 + (rest - angle) * 5, easing: "cubic-bezier(.2,.6,.3,1)", fill: "forwards" }).finished
      .then(() => { turntable.classList.remove("playing", "paused"); disc.getAnimations().forEach(x => x.cancel()); disc.style.animation = ""; }).catch(() => {});
  }
  async function finish() {
    cancelAnimationFrame(raf); handle = null;
    ToneEngine.stopSurfaceNoise();
    $("pp").textContent = "▶"; $("pp").setAttribute("aria-label", "Play again");
    status("");
    // coast to rest — but never stay locked if the tab is hidden and animations are frozen
    await Promise.race([coastToRest(), wait(reduced ? 50 : 4500)]);
    const disc = turntable.querySelector(".record-disc");
    disc.getAnimations().forEach(a => a.cancel()); disc.style.animation = "";
    turntable.classList.remove("playing", "paused");
    running = false;
    document.documentElement.classList.remove("transposing");
    JournalInput.lock(false);
    body.querySelectorAll(".w.lifted").forEach(w => w.classList.remove("lifted"));
    $("transpose-btn").disabled = false; $("week-btn").disabled = false;
  }

  /* ── the whole sequence ───────────────────────────────────────────── */
  let running = false, runId = 0, mode = "";   // runId: reset() bumps it, so an in-flight sequence bails at its next beat
  const status = (m) => { $("status").textContent = m; };
  function begin(kind) {
    running = true; mode = kind;
    const my = ++runId, alive = () => my === runId;
    document.documentElement.classList.add("transposing");
    JournalInput.lock(true);
    $("transpose-btn").disabled = true; $("week-btn").disabled = true; status("");
    return alive;
  }
  async function runTranspose() {
    if (running) return;
    const affect = Composure.state.current;
    if (!affect || !affect.text) { status("write a few words first — then transpose them"); return; }
    if (JournalInput.state.mode === "write") { await JournalInput.commit(); }
    JournalInput.view();   // the page as inked spans, highlights and all
    const wordEls = [...body.querySelectorAll(".w")];
    const alive = begin("day");
    const plan = ToneEngine.motifFor(affect);
    // warm the audio up now (inside the click gesture) so beat 4 starts the instant the needle lands
    if (typeof Tone !== "undefined") ToneEngine.prepare(plan.affect, { plan }).catch(err => status("audio: " + err.message));
    await wordsToNotes(plan, wordEls);      if (!alive()) return;   // 1
    await sheetToRecord(alive);             if (!alive()) return;   // 2
    await recordToTurntable();              if (!alive()) return;   // 3
    await needleAndPlay(plan, alive);                               // 4
    return plan;
  }

  /** The week as one piece: each day's motif in date order; the rail follows along. */
  async function runWeek() {
    if (running) return;
    const entries = Composure.state.entries.filter(e => e.text);
    if (!entries.length) { status("no entries yet this week"); return; }
    if (JournalInput.state.mode === "write") { await JournalInput.commit(); }
    const alive = begin("week");
    if (typeof Tone === "undefined") { status("audio unavailable (Tone.js did not load)"); return finish(); }
    try {
      const week = ToneEngine.weekPlan(entries);
      turntable.classList.add("playing");
      controlsOn(`the week · ${week.days.length} days`, week.totalSec);
      await ToneEngine.needleDrop();
      await ToneEngine.startSurfaceNoise(-40);
      await wait(250);
      if (!alive()) return;
      const h = await ToneEngine.composeWeek(entries, {
        week,
        onDay: (day) => { if (alive() && Composure.getEntry(day.date)) { JournalInput.lock(false); JournalInput.open(day.date); JournalInput.lock(true); } },
        onNote: (n) => { if (alive()) driftNote(n); },
        onEnd: () => { if (alive()) finish(); }
      });
      if (!alive()) { h.stop(); return; }
      handle = h; tick();
    } catch (err) { status("audio error: " + err.message); finish(); }
  }

  function reset() {
    runId++;
    cancelAnimationFrame(raf);
    if (typeof ToneEngine !== "undefined") { ToneEngine.stop(); ToneEngine.stopSurfaceNoise(); }
    handle = null; running = false;
    const sheet = $("sheet");
    sheet.getAnimations().forEach(a => a.cancel());
    sheet.querySelectorAll("*").forEach(el => el.getAnimations().forEach(a => a.cancel()));
    sheet.removeAttribute("style");
    sheet.querySelectorAll(".paper, .vinyl, .label, .staff").forEach(el => el.removeAttribute("style"));
    $("staff").innerHTML = "";
    $("flyers").innerHTML = "";
    const disc = turntable.querySelector(".record-disc");
    disc.getAnimations().forEach(a => a.cancel()); disc.style.animation = "";
    turntable.classList.remove("playing", "paused");
    $("controls").classList.remove("on");
    document.documentElement.classList.remove("transposing");
    JournalInput.lock(false);
    body.querySelectorAll(".w.lifted").forEach(w => w.classList.remove("lifted"));
    $("transpose-btn").disabled = false; $("week-btn").disabled = false;
    status("");
  }

  /* ── wiring ───────────────────────────────────────────────────────── */
  $("transpose-btn").addEventListener("click", runTranspose);
  $("week-btn").addEventListener("click", runWeek);
  $("pp").addEventListener("click", () => {
    if (!handle && running) return;   // the sequence is in flight; the music hasn't started yet
    if (!handle) { reset(); (mode === "week" ? runWeek : runTranspose)(); return; }
    if (handle.playing) { handle.pause(); turntable.classList.add("paused"); $("pp").textContent = "▶"; $("pp").setAttribute("aria-label", "Resume"); }
    else { handle.resume(); turntable.classList.remove("paused"); $("pp").textContent = "❚❚"; $("pp").setAttribute("aria-label", "Pause"); }
  });
  $("again").addEventListener("click", reset);

  window.Transpose = { run: runTranspose, runWeek, reset };
})();
</script>
</body>
</html>
